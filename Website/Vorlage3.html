<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Visitenkarte Neon Trace</title>
<style>
  :root{--bg:#02060a;--panel:#07121a;--neon:#00ffd5;--muted:#8aa6ad}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:#e8fbf7}
  .center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:36px}
  .card{width:420px;padding:22px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);box-shadow:0 12px 40px rgba(0,0,0,0.7);position:relative;overflow:hidden;border:1px solid rgba(0,255,213,0.06)}
  /* animierte Leiterbahn */
  .trace{position:absolute;inset:0;pointer-events:none}
  .name{font-size:20px;margin:0}
  .desc{color:var(--muted);margin:6px 0 14px}
  .links{display:flex;flex-direction:column;gap:10px}
  .link{padding:10px;border-radius:8px;background:rgba(0,0,0,0.25);color:var(--neon);text-decoration:none;border:1px solid rgba(0,255,213,0.06);display:flex;justify-content:space-between;align-items:center}
  .impressum-btn{margin-top:14px;padding:8px 10px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.03);color:var(--muted);text-decoration:none;display:inline-block}
  /* kleine Animation */
  @keyframes glow{0%{filter:drop-shadow(0 0 0 rgba(0,255,213,0.0))}50%{filter:drop-shadow(0 0 12px rgba(0,255,213,0.18))}100%{filter:drop-shadow(0 0 0 rgba(0,255,213,0.0))}}
  .neon{animation:glow 2.6s infinite}
</style>
</head>
<body>
<div class="center">
  <article class="card" aria-label="Neon Trace Visitenkarte">
    <svg class="trace" viewBox="0 0 800 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#00ffd5"/><stop offset="1" stop-color="#00a6ff"/></linearGradient></defs>
      <g fill="none" stroke="url(#lg)" stroke-width="2" opacity="0.18">
        <path d="M20 120 C120 40, 300 40, 380 120 S620 200, 780 120" />
        <path d="M20 260 C120 180, 300 180, 380 260 S620 340, 780 260" />
      </g>
      <g class="neon" stroke="url(#lg)" stroke-width="1.6" fill="none" opacity="0.9">
        <path d="M20 120 C120 40, 300 40, 380 120 S620 200, 780 120" stroke-dasharray="8 6" stroke-dashoffset="0"/>
      </g>
    </svg>

    <h3 class="name"><!-- NAME Platzhalter -->Max Mustermann</h3>
    <div class="desc">Founder unified forces · Technologie · Strategie</div>

    <div class="links">
      <a class="link" href="#work">Arbeitsbereiche <span style="color:var(--muted);font-size:13px">→</span></a>
      <a class="link" href="#projects">Projekte <span style="color:var(--muted);font-size:13px">→</span></a>
      <a class="link" href="#contact">Kontakt <span style="color:var(--muted);font-size:13px">→</span></a>
    </div>

    <a class="impressum-btn" href="#impressum">Impressum und Datenschutz</a>
  </article>
</div>

<!-- Modal- oder Abschnittsplatzhalter für Impressum -->
<section id="impressum" style="display:none">
  <!-- Bitte hier vollständige Anbieterkennzeichnung nach deutschem Recht eintragen:
       Name, Anschrift, E-Mail, Telefonnummer, ggf. Handelsregister, USt-ID, Verantwortlicher für Inhalte -->
</section>
</body>
</html>
