<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Visitenkarte — Platzhalter Name</title>
<style>
  :root{
    --bg:#0b0f12;
    --card:#0f1720;
    --accent:#00d1ff;
    --muted:#9aa6b2;
  }
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;color:#e6eef3;background:linear-gradient(180deg,#050607 0%,var(--bg) 100%);}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px}
  .card{width:360px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border-radius:12px;padding:22px;box-shadow:0 6px 30px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.03);position:relative;overflow:hidden}
  /* dezente Leiterplatten-Linien */
  .card::before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(0,209,255,0.03) 1px,transparent 1px),linear-gradient(0deg,rgba(0,209,255,0.02) 1px,transparent 1px);background-size:40px 40px;mix-blend-mode:overlay;pointer-events:none}
  h1{margin:0;font-size:20px;color:#fff;letter-spacing:0.2px}
  p.role{margin:6px 0 14px;color:var(--muted);font-size:13px}
  .links{display:flex;flex-direction:column;gap:8px}
  .link{display:inline-flex;align-items:center;gap:10px;padding:10px;border-radius:8px;text-decoration:none;color:#cfeff8;background:transparent;border:1px solid rgba(255,255,255,0.02);transition:all .18s}
  .link:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,209,255,0.06);border-color:rgba(0,209,255,0.12)}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--muted)}
  .tag{background:rgba(0,209,255,0.06);color:var(--accent);padding:6px 8px;border-radius:999px;font-weight:600;font-size:12px}
  footer{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
  a.impressum{color:var(--muted);text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <section class="card" aria-label="Visitenkarte">
    <h1><!-- NAME Platzhalter -->Max Mustermann</h1>
    <p class="role"><!-- KURZBESCHREIBUNG Platzhalter -->Berater für digitale Strategien · Gründer von unified forces</p>

    <div class="links">
      <a class="link" href="#about">Über mich</a>
      <a class="link" href="#work">Arbeitsbereiche</a>
      <a class="link" href="#projects">Projekte</a>
      <a class="link" href="#contact">Kontakt</a>
    </div>

    <div class="meta">
      <span class="tag">unified forces</span>
      <span style="color:var(--muted)">Heidenheim, DE</span>
    </div>

    <footer>
      <a class="impressum" href="#impressum">Impressum und Datenschutz</a>
    </footer>
  </section>
</div>

<!-- Platzhalter-Sektionen für Inhalte -->
<section id="about" style="display:none">
  <!-- Hier ausführliche Biografie einfügen -->
</section>
<section id="work" style="display:none">
  <!-- Hier Arbeitsbereiche und kurze Beschreibungen einfügen -->
</section>
<section id="projects" style="display:none">
  <!-- Hier Projekte und Links einfügen -->
</section>
<section id="contact" style="display:none">
  <!-- Kontaktinformationen einfügen -->
</section>

<section id="impressum" style="display:none">
  <!-- IMPRESSUM Platzhalter
       Bitte hier vollständige Anbieterkennzeichnung nach deutschem Recht einfügen:
       Name, Anschrift, Kontakt, Umsatzsteuer-ID falls vorhanden, Verantwortlicher für Inhalte -->
</section>
</body>
</html>
